name: shalom_bible
description: Shalom Bible - AI-powered Bible reading and sermon preparation app
publish_to: 'none'
version: 1.0.4+7

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.6.3

  # HTTP
  dio: ^5.7.0

  # Local database
  sqflite: ^2.3.2
  path: ^1.9.0

  # Secure storage (JWT tokens)
  flutter_secure_storage: ^9.2.4

  # Fonts
  google_fonts: ^6.2.1

  # Shared preferences
  shared_preferences: ^2.3.4

  # Share content
  share_plus: ^10.1.4

  # Markdown rendering
  flutter_markdown: ^0.7.7

  # UUID
  uuid: ^4.5.1

  # Intl
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/images/icon_with_background.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/bible/
    - assets/strongs/
    - assets/images/
    - bibles_json/pt/
    - bibles_json/en/
